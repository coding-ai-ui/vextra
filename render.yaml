# Free demonstration deployment. Render's free PostgreSQL expires after 30 days.
# Upgrade the database plan before expiry for ongoing hosting.
services:
  - type: web
    name: vextra
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_TRUST_PROXY
        value: "true"
      - key: SERVE_FRONTEND
        value: "true"
      - key: DJANGO_DATABASE_CACHE
        value: "true"
      - key: VEXTRA_DEMO_MODE
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: vextra-db
          property: connectionString
databases:
  - name: vextra-db
    plan: free
    region: frankfurt
    databaseName: vextra
    user: vextra
    ipAllowList: []
